<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jurnal Fix</title>
<style>
body{background:#0d1117;color:#fff;font-family:sans-serif;max-width:500px;margin:auto;padding:16px}
.card{background:#161b22;border:1px solid #333;border-radius:14px;padding:14px;margin-bottom:12px}
textarea,input{width:100%;background:#0d1117;color:#fff;border:1px solid #333;border-radius:10px;padding:12px;margin-top:8px}
textarea{height:130px}
button{width:100%;padding:12px;border-radius:10px;border:0;font-weight:bold;margin-top:8px}
.blue{background:#2ea043;color:#fff}
.gray{background:#21262d;color:#fff;border:1px solid #333}
.mood{font-size:28px;opacity:.3;cursor:pointer;padding:5px}
.mood.active{opacity:1;background:#21262d;border-radius:8px}
.item{border-bottom:1px solid #222;padding:10px 0;font-size:13px;white-space:pre-wrap}
</style>
</head>
<body>
<h2>📔 Jurnal Fix (Anti Bug)</h2>

<div class="card">
<div id="moods"></div>
<input id="judul" placeholder="Judul (opsional)">
<textarea id="isi" placeholder="Tulis curhatan lo disini..."></textarea>
<button class="blue" onclick="simpan()">💾 SIMPAN - UDAH FIX</button>
<button class="gray" onclick="resetForm()">BATAL</button>
<div id="status" style="font-size:12px;color:#8b949e;margin-top:8px"></div>
</div>

<div class="card">
<input id="cari" placeholder="Cari..." oninput="tampil()">
<div id="list"></div>
<button class="gray" onclick="exportTXT()">📤 Export Backup</button>
</div>

<script>
// FIXED VERSION
let mood='😄';
let moods=['😄','😐','😔','😭','😡','🥰'];
let editId=null;

function initMood(){
 document.getElementById('moods').innerHTML = moods.map(m => 
  `<span class="mood ${m===mood?'active':''}" onclick="pilihMood('${m}')">${m}</span>`
 ).join(' ');
}
function pilihMood(m){ mood=m; initMood(); }

function getData(){
 try{ return JSON.parse(localStorage.getItem('jurnal_fix')||'[]') }catch(e){ return [] }
}
function setData(d){
 localStorage.setItem('jurnal_fix', JSON.stringify(d));
}

function simpan(){
 let judul=document.getElementById('judul').value;
 let isi=document.getElementById('isi').value;
 if(!isi.trim()){ alert('Isi dulu jurnalnya jir'); return; }
 
 let data=getData();
 let tgl=new Date().toLocaleString('id-ID');
 
 if(editId){
   let idx=data.findIndex(x=>x.id===editId);
   if(idx>=0) data[idx]={...data[idx], judul, isi, mood, tgl: data[idx].tgl + ' (edit)'};
   editId=null;
 }else{
   data.unshift({id:Date.now(), tgl, judul, isi, mood});
 }
 setData(data);
 document.getElementById('status').innerText='✅ Kesimpen jam '+tgl+' - total '+data.length+' jurnal';
 resetForm();
 tampil();
}

function resetForm(){
 document.getElementById('judul').value='';
 document.getElementById('isi').value='';
 editId=null;
}

function tampil(){
 let q=(document.getElementById('cari').value||'').toLowerCase();
 let data=getData().filter(x => (x.judul+x.isi).toLowerCase().includes(q));
 document.getElementById('list').innerHTML = data.map(j => `
  <div class="item">
   <b>${j.mood} ${j.tgl} - ${j.judul||'Tanpa Judul'}</b>
   <div>${j.isi}</div>
   <div style="margin-top:6px">
    <span style="color:#58a6ff" onclick="editJ(${j.id})">[Edit]</span> 
    <span style="color:#f85149;margin-left:10px" onclick="hapusJ(${j.id})">[Hapus]</span>
   </div>
  </div>
 `).join('') || '<p style="color:#666;text-align:center">Belum ada</p>';
}

function editJ(id){
 let data=getData(); let j=data.find(x=>x.id===id);
 if(!j) return;
 document.getElementById('judul').value=j.judul;
 document.getElementById('isi').value=j.isi;
 mood=j.mood; editId=id; initMood();
 window.scrollTo(0,0);
}

function hapusJ(id){
 if(!confirm('Hapus?')) return;
 setData(getData().filter(x=>x.id!==id));
 tampil();
}

function exportTXT(){
 let data=getData();
 if(!data.length) return alert('Kosong');
 let txt=data.map(d=>`[${d.tgl}] ${d.mood} ${d.judul}\n${d.isi}\n---`).join('\n\n');
 let a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain'}));
 a.download='backup-jurnal.txt'; a.click();
}

initMood(); tampil();
console.log('Jurnal fix loaded, localStorage key=jurnal_fix');
</script>
</body>
</html>
